<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resala AUC — Winter Wish</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="wishes-extra.css">
<link rel="stylesheet" href="angel.css">
<link rel="icon" href="assets/logo.jpeg" type="image/jpeg">
</head>
<body class="angel">
<canvas id="snow" aria-hidden="true"></canvas>

<header class="site-header">
  <img class="logo" src="assets/logo.jpeg" alt="Resala AUC logo">
  <div>
    <h1>Resala AUC</h1>
    <p>Winter Warmth Campaign ❄</p>
  </div>
</header>

<section class="hero" style="padding-bottom:90px">
  <h1 class="gift-title" style="font-size:clamp(2.2rem,9vw,3.4rem)">Gift an <span class="script">Angel</span></h1>
  <p class="wish-num" id="wnum"></p>
  <div class="title-row"><div class="icon-col" aria-hidden="true"><img src="assets/icon-coat.svg" alt=""><img src="assets/icon-scarf.svg" alt=""></div><h2 id="wtitle">Winter Wish</h2><div class="icon-col" aria-hidden="true"><img src="assets/icon-beanie.svg" alt=""><img src="assets/icon-mitten.svg" alt=""></div></div>
  <div class="snowcap" aria-hidden="true"></div>
</section>

<main>
  <div class="card" id="card"></div>
</main>

<div class="angel-footer">
  <div class="credit">Thank you for supporting <strong>Resala AUC</strong></div>
</div>

<script src="wishes.js"></script>
<script src="snow.js"></script>
<script>
  var id = Number(new URLSearchParams(location.search).get('id'));
  var w = window.WISHES.find(function (x) { return x.id === id; });
  var card = document.getElementById('card');
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; }

  function copyText(text, btn) {
    function done(ok) {
      btn.textContent = ok ? 'Copied ✓' : 'Copy failed';
      btn.classList.toggle('copied', ok);
      setTimeout(function () { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1800);
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(false); });
    } else {
      var t = document.createElement('textarea'); t.value = text; t.style.position = 'fixed'; t.style.opacity = '0';
      document.body.appendChild(t); t.select();
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(t); done(ok);
    }
  }

  if (!w) {
    document.getElementById('wtitle').textContent = 'Wish not found';
    card.appendChild(el('h3', '', 'We could not find that wish'));
    card.appendChild(el('p', '', 'Please go back and check the number.'));
  } else {
    document.title = 'Resala AUC — Wish #' + w.id;
    document.getElementById('wnum').textContent = 'Wish #' + w.id;
    document.getElementById('wtitle').textContent = w.name + '’s Winter Wish';
    card.appendChild(el('h3', '', 'What ' + w.name + ' is hoping for'));
    var who = el('div', 'who');
    who.appendChild(el('span', 'chip', w.gender));
    who.appendChild(el('span', 'chip', w.age + ' old'));
    card.appendChild(who);
    var list = el('div', 'wish-list');
    w.items.forEach(function (it) {
      var row = el('div', 'wish-item');
      row.appendChild(el('label', '', it.label));
      row.appendChild(el('div', 'value', it.item));
      if (it.size) row.appendChild(el('span', 'size', 'Size: ' + it.size));
      if (it.color) row.appendChild(el('div', 'color', 'Color: ' + it.color));
      list.appendChild(row);
    });
    card.appendChild(list);
    if (w.contact && w.contact.phones && w.contact.phones.length) {
      var box = el('div', 'contact');
      box.appendChild(el('label', '', 'Contact'));
      if (w.contact.mother) {
        var mn = el('div', 'mother', 'Mother: ' + w.contact.mother);
        mn.setAttribute('dir', 'auto');
        box.appendChild(mn);
      } else {
        box.appendChild(el('div', 'mother', 'Mother’s phone'));
      }
      w.contact.phones.forEach(function (ph) {
        var line = el('div', 'phone-row');
        line.appendChild(el('a', 'phone', ph)).href = 'tel:' + ph;
        var btn = el('button', 'copy-btn', 'Copy');
        btn.type = 'button';
        btn.addEventListener('click', function () { copyText(ph, btn); });
        line.appendChild(btn);
        box.appendChild(line);
      });
      card.appendChild(box);
    }
  }
  if (w) card.appendChild(el('p', 'note', 'Sizes are shown as the family wrote them (clothing or shoe size).'));
</script>
</body>
</html>
