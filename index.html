<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resala AUC — Gift an Angel</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="angel.css">
<link rel="icon" href="assets/logo.jpeg" type="image/jpeg">
</head>
<body class="angel">
<canvas id="snow" aria-hidden="true"></canvas>

<main class="angel-main">
  <img class="logo" src="assets/logo.jpeg" alt="Resala AUC logo">
  <h1 class="gift-title">Gift an <span class="script">Angel</span></h1>
  <p style="margin:26px 0 0"><label class="wish-label" for="num">Wish number:</label></p>
  <form id="form" novalidate>
    <input id="num" type="text" inputmode="numeric" autocomplete="off" placeholder="000" autofocus>
    <button class="go" type="submit">Reveal the wish</button>
    <p class="error" id="err" role="alert"></p>
    <p class="hint" id="hint"></p>
  </form>
  <ol class="angel-steps">
    <li>1- Scan the QR code</li>
    <li>2- Enter the wish number</li>
    <li>3- Fulfil an angel's wish</li>
  </ol>
</main>

<div class="angel-footer">
  <div class="hills" aria-hidden="true">
    <svg viewBox="0 0 1440 130" preserveAspectRatio="none">
      <path d="M0 70 C 200 20 380 20 560 60 S 900 110 1100 50 S 1350 20 1440 55 V130 H0 Z" fill="#c9e4fa"/>
      <path d="M0 95 C 240 55 420 60 640 90 S 1020 125 1220 85 S 1380 70 1440 90 V130 H0 Z" fill="#dff1ff"/>
      <path d="M0 118 C 300 95 560 100 800 115 S 1250 125 1440 108 V130 H0 Z" fill="#f4faff"/>
    </svg>
  </div>
  <div class="credit">Thank you for supporting <strong>Resala AUC</strong></div>
</div>

<script src="wishes.js"></script>
<script src="snow.js"></script>
<script>
  var max = window.WISHES.length;
  document.getElementById('hint').textContent = 'Wish numbers go from 1 to ' + max + '.';
  document.getElementById('form').addEventListener('submit', function (e) {
    e.preventDefault();
    var raw = document.getElementById('num').value.trim().replace(/[٠-٩]/g, function (d) { return d.charCodeAt(0) - 1632; });
    var n = Number(raw);
    if (!/^\d+$/.test(raw) || n < 1 || n > max) {
      document.getElementById('err').textContent = 'Please enter a number between 1 and ' + max + '.';
      return;
    }
    location.href = 'wish.html?id=' + n;
  });
</script>
</body>
</html>
